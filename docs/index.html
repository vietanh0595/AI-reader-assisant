<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BookSense AI</title>
<style>
  :root { --bg:#f7f5f0; --card:#fffdf8; --ink:#1a1a18; --muted:#5f5a52; --rule:#e2ddd3; --accent:#244f38; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14140f; --card:#1c1c17; --ink:#ece8df; --muted:#a09a8f; --rule:#33322a; --accent:#9dc4a8; }
  }
  body {
    margin:0; padding:4rem 1.25rem; background:var(--bg); color:var(--ink);
    font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width:34rem; margin:0 auto; }
  h1 { font-size:1.8rem; margin:0 0 .5rem; letter-spacing:-.02em; }
  p { color:var(--muted); }
  ul { list-style:none; padding:0; margin:2rem 0 0; }
  li { border-top:1px solid var(--rule); }
  a { display:block; padding:1rem .25rem; color:var(--accent); text-decoration:none; font-weight:600; }
  a:hover { text-decoration:underline; }
</style>
</head>
<body>
<main>
  <h1>BookSense AI</h1>
  <p>An iOS reading app that answers questions about the book in front of you.</p>
  <ul>
    <li><a href="privacy.html">Privacy Policy &rarr;</a></li>
  </ul>
</main>
</body>
</html>
