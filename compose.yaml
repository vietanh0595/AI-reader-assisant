services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: reader
      POSTGRES_PASSWORD: reader
      POSTGRES_USER: reader
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reader -d reader"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - reader-postgres:/var/lib/postgresql/data

  postgres-test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: reader_test
      POSTGRES_PASSWORD: reader
      POSTGRES_USER: reader
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reader -d reader_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    profiles: ["test"]

volumes:
  reader-postgres:
