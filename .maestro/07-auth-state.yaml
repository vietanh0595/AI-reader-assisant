# Signing out leaves a working guest app, not a broken one.
#
# PRECONDITION: starts signed in.
#
# DESTRUCTIVE — tagged so the normal suite run skips it. Signing out is the
# point of the flow, but it poisons every later flow that needs an account
# (03, 06, 09). Maestro's execution order across a folder is not something to
# rely on, so "just name it last" is not a fix. Run it deliberately:
#
#   maestro test .maestro/07-auth-state.yaml
#
# then sign back in by hand (Auth0's hosted sheet cannot be automated).
tags:
  - destructive
#
# Scope note: signing back IN is deliberately not automated. It goes through
# Auth0's hosted web sheet (and Apple's system sheet for Sign in with Apple),
# neither of which Maestro can drive reliably. Sign-in stays on the manual
# checklist.
#
# What this DOES cover is the more dangerous direction. The guest path is the
# whole onboarding story — the sample book is meant to work with no account —
# and a sign-out that leaves the reader in a half-authenticated state breaks
# first impressions for every new user. The backlog also records a real bug of
# this shape: delete silently failing when signed out instead of prompting.
appId: com.vietanh.aibookreader
---
- launchApp

# Account controls live on the Library screen (LibraryScreen), not the reader.
- extendedWaitUntil:
    visible: "Open library"
    timeout: 20000
- tapOn:
    text: "Dismiss"
    optional: true
- tapOn: "Open library"

- extendedWaitUntil:
    visible: "Sign out"
    timeout: 15000

- tapOn: "Sign out"

# Sign-out is guarded by an Alert ("Sign out?" / Cancel / Sign out). Wait for it
# rather than blind-tapping: the alert takes a moment, and the library button
# underneath ALSO matches "Sign out", so an early tap hits the covered button
# and silently does nothing while reporting COMPLETED.
- extendedWaitUntil:
    visible: "Sign out?"
    timeout: 10000

# index: 1 selects the alert's button rather than the library button behind it,
# since both match the same text.
- tapOn:
    text: "Sign out"
    index: 1

- extendedWaitUntil:
    visible: "Sign in"
    timeout: 15000

# Back into the book. The guest experience must still work: Summarize is
# guest-open and needs no text selection, so it is the cheapest proof the core
# loop survived sign-out.
# Matched by pattern rather than coordinates: the library labels each entry
# "Resume <book title>", so this works for whatever book is open without
# hardcoding a title or guessing where a card sits on screen.
- tapOn:
    text: "Resume .*"

# Signing out raises the session banner, which overlays the reader header — the
# same interception that makes the header's own controls untappable. Clear it
# before touching anything up there.
- tapOn:
    text: "Dismiss"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000

- extendedWaitUntil:
    visible: "Summarize current page"
    timeout: 15000
- tapOn: "Summarize current page"

- extendedWaitUntil:
    visible: "Summary"
    timeout: 60000
- assertVisible:
    text: ".{40,}"
