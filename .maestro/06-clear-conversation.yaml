# Clearing a conversation is confirmed first, and empties the thread.
#
# PRECONDITION: signed in, with an indexed book (same as 03-ask-the-book).
#
# IMPORTANT — what this does NOT test, and why:
#
# "Clear conversation" writes the old turns into `archivedConversations`
# (App.tsx ~3940), so the data is kept. But NOTHING IN THE UI EVER READS THAT
# ARRAY. There is no screen, button, or gesture that shows a cleared thread.
# ("Reopen conversation" is unrelated — it only un-collapses a minimised
# thread via setIsThreadCollapsed(false).)
#
# So from the reader's point of view, clearing is currently indistinguishable
# from deleting. A restore assertion here would be asserting a feature that
# does not exist. Tracked as an open question in the release plan instead:
# either build the restore UI, or stop archiving data nobody can reach.
#
# What IS worth guarding: the destructive action must stay behind a
# confirmation, and cancelling must genuinely cancel.
appId: com.vietanh.aibookreader
---
- launchApp

- extendedWaitUntil:
    visible: "Ask the book"
    timeout: 20000
- tapOn: "Ask the book"

- extendedWaitUntil:
    visible: "Ask a follow-up.*"
    timeout: 10000

- tapOn: "Ask a follow-up.*"
- inputText: "What is this chapter about?"
- tapOn: "Send"

- extendedWaitUntil:
    visible: ".{60,}"
    timeout: 90000

# The question we asked is in the thread as our own turn. It is short, unique
# and free of regex metacharacters, which makes it a far better probe than a
# ".{60,}" length match — the reader's book text sits behind the thread in the
# hierarchy and would satisfy any generic long-text assertion.
- assertVisible:
    text: "What is this chapter about.*"

# A destructive action must ask first.
- tapOn: "Clear conversation"
- extendedWaitUntil:
    visible: "Clear conversation?"
    timeout: 10000

# Cancel must actually cancel — the thread should survive untouched.
- tapOn: "Cancel"
- assertVisible:
    text: "What is this chapter about.*"

# Now confirm for real.
- tapOn: "Clear conversation"
- extendedWaitUntil:
    visible: "Clear conversation?"
    timeout: 10000
- tapOn: "Clear"

# The thread is genuinely empty: our question is gone, while the composer
# remains so the reader can start again rather than facing a broken panel.
- extendedWaitUntil:
    notVisible: "What is this chapter about.*"
    timeout: 10000
- assertVisible: "Ask a follow-up.*"
